<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title></title>
    <script>
      const splashTheme = new URLSearchParams(location.search).get('theme')
      document.documentElement.dataset.theme = splashTheme === 'dark' ? 'dark' : 'light'
      if (navigator.platform.toLowerCase().startsWith('win')) {
        document.documentElement.dataset.platform = 'windows'
      }
    </script>
    <style>
      :root { color-scheme: dark; font-family: 'Fragment Mono', ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { color: #f0f0f2; background: #0a0a0c; }
      main {
        position: fixed;
        inset: 0;
        display: grid;
        align-content: center;
        justify-items: center;
        gap: 16px;
        padding: 32px;
        text-align: center;
      }
      html[data-platform="windows"] main { padding-top: 70px; }
      .markFrame { display: grid; place-items: center; width: 100%; }
      .splashVideo { width: 280px; height: auto; border-radius: 8px; opacity: 0.8; }
      .title { margin: 0; font-size: 16px; font-weight: 400; letter-spacing: 0.01em; color: #f0f0f2; font-family: inherit; }
      .title .sigil { color: #ff3333; }
      .status { margin: -2px 0 0; color: #6b6b73; font-size: 12px; font-family: inherit; }
      .cursor {
        display: inline-block;
        width: 7px;
        height: 1em;
        background: #ff3333;
        vertical-align: text-bottom;
        margin-left: 2px;
        animation: blink 1s step-end infinite;
      }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .cursor { animation: none; opacity: 1; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="markFrame" aria-hidden="true">
        <video class="splashVideo" src="splash-video.webm" autoplay loop muted playsinline></video>
      </div>
      <h1 class="title" id="title"><span class="sigil">✦</span> starting mitsumeru<span class="cursor"></span></h1>
      <p class="status" id="status">the gaze awakens.</p>
    </main>
    <script>
      if (navigator.language.toLowerCase().startsWith('zh')) {
        document.getElementById('title').innerHTML = '<span class="sigil">✦</span> 正在启动 Mitsumeru<span class="cursor"></span>'
        document.getElementById('status').textContent = '凝视正在觉醒。'
      }
    </script>
  </body>
</html>
