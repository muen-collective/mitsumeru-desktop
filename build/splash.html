<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title></title>
    <script>
      const splashTheme = new URLSearchParams(location.search).get('theme')
      document.documentElement.dataset.theme = splashTheme === 'dark' ? 'dark' : 'light'
      if (navigator.platform.toLowerCase().startsWith('win')) {
        document.documentElement.dataset.platform = 'windows'
      }
    </script>
    <style>
      :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { color: #17181a; background: #0a0a0c; }
      main {
        position: fixed;
        inset: 0;
        display: grid;
        align-content: center;
        justify-items: center;
        gap: 16px;
        padding: 32px;
        text-align: center;
      }
      html[data-platform="windows"] main { padding-top: 70px; }
      .markFrame { display: grid; place-items: center; width: 100%; }
      .splashVideo { width: 320px; height: auto; border-radius: 8px; }
      .title { margin: 0; font-size: 23px; font-weight: 650; letter-spacing: -0.02em; color: #f3f4f6; }
      .status { margin: -4px 0 0; color: #9ca0a8; font-size: 13px; }
      :root[data-theme='dark'] {
        color-scheme: dark;
      }
      :root[data-theme='dark'] body {
        color: #f3f4f6;
        background: #0a0a0c;
      }
      :root[data-theme='dark'] .status {
        color: #9ca0a8;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme]) body { color: #f3f4f6; background: #0a0a0c; }
        :root:not([data-theme]) .status { color: #9ca0a8; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="markFrame" aria-hidden="true">
        <video class="splashVideo" src="splash-video.webm" autoplay loop muted playsinline></video>
      </div>
      <h1 class="title" id="title">Starting Mitsumeru</h1>
      <p class="status" id="status">First launch may take a moment.</p>
    </main>
    <script>
      if (navigator.language.toLowerCase().startsWith('zh')) {
        document.getElementById('title').textContent = '正在启动 Mitsumeru'
        document.getElementById('status').textContent = '首次启动可能需要一点时间。'
      }
    </script>
  </body>
</html>
