name: Release desktop installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target:
        description: Platform to build
        required: false
        default: all
        type: choice
        options:
          - all
          - windows
          - macos
      prerelease_tag:
        description: Non-v semver tag
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-apple-silicon:
    name: macOS Apple Silicon
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'macos'))
    runs-on: macos-15
    steps:
      - run: echo "Apple Silicon build"

  publish:
    name: Publish GitHub Release
    if: >-
      always() &&
      startsWith(github.ref, 'refs/tags/v') &&
      inputs.prerelease_tag == '' &&
      needs.macos-apple-silicon.result == 'success'
    needs: [macos-apple-silicon]
    runs-on: ubuntu-24.04
    steps:
      - run: echo "Publish"
