name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck & Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build-macos-dev:
    name: Build macOS Dev (ARM64)
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build dev package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run package:dev:mac:arm64
      - uses: actions/upload-artifact@v4
        with:
          name: mitsumeru-dev-mac-arm64
          path: |
            dist-dev/mitsumeru-dev-mac-arm64.dmg
            dist-dev/mitsumeru-dev-mac-arm64.zip
          if-no-files-found: warn
          retention-days: 3
