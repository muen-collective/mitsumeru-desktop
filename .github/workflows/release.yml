name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      prerelease_tag:
        description: Pre-release tag
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  quality:
    name: Quality
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    needs: [quality]
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      is_release: ${{ steps.version.outputs.is_release }}
    steps:
      - id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
            IS_RELEASE=true
          elif [ -n "${{ inputs.prerelease_tag }}" ]; then
            TAG="${{ inputs.prerelease_tag }}"
            VERSION="$TAG"
            IS_RELEASE=false
          else
            TAG="dev-$(date -u +%Y%m%d-%H%M%S)"
            VERSION="0.0.0-dev"
            IS_RELEASE=false
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is_release=$IS_RELEASE" >> "$GITHUB_OUTPUT"

  build-macos-arm64:
    name: macOS Apple Silicon
    runs-on: macos-15
    timeout-minutes: 180
    needs: [quality, prepare]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Prepare Apple notarization key
        if: needs.prepare.outputs.is_release == 'true'
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.DESKTOP_APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.DESKTOP_APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.DESKTOP_APPLE_API_ISSUER }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"
      - name: Prepare signing certificate
        if: needs.prepare.outputs.is_release == 'true'
        env:
          CSC_P12_BASE64: ${{ secrets.DESKTOP_CSC_LINK }}
          CSC_PASSWORD: dummy_pw
        run: |
          b64="$RUNNER_TEMP/developer-id.p12.b64"
          p12="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$CSC_P12_BASE64" > "$b64"
          base64 -d < "$b64" > "$p12"
          chmod 600 "$p12"
          echo "CSC_LINK=$p12" >> "$GITHUB_ENV"
          echo "CSC_KEY_PASSWORD=$CSC_PASSWORD" >> "$GITHUB_ENV"
      - name: Set version
        run: npm version --no-git-tag-version --allow-same-version ${{ needs.prepare.outputs.version }}
      - name: Build signed package
        if: needs.prepare.outputs.is_release == 'true'
        run: npm run package:mac:arm64
      - name: Build unsigned dev package
        if: needs.prepare.outputs.is_release != 'true'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run package:dev:mac:arm64
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml
            dist-dev/*.dmg
            dist-dev/*.zip
            dist-dev/latest-mac.yml
          if-no-files-found: warn
          retention-days: 7

  build-macos-x64:
    name: macOS Intel
    runs-on: macos-15-intel
    timeout-minutes: 180
    needs: [quality, prepare]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Prepare Apple notarization key
        if: needs.prepare.outputs.is_release == 'true'
        env:
          APPLE_API_KEY_CONTENT: dummy_apikey
          APPLE_API_KEY_ID: dummy_keyid
          APPLE_API_ISSUER: dummy_issuer
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"
      - name: Prepare signing certificate
        if: needs.prepare.outputs.is_release == 'true'
        env:
          CSC_P12_BASE64: dummy_csc
          CSC_PASSWORD: dummy_pw
        run: |
          b64="$RUNNER_TEMP/developer-id.p12.b64"
          p12="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$CSC_P12_BASE64" > "$b64"
          base64 -d < "$b64" > "$p12"
          chmod 600 "$p12"
          echo "CSC_LINK=$p12" >> "$GITHUB_ENV"
          echo "CSC_KEY_PASSWORD=$CSC_PASSWORD" >> "$GITHUB_ENV"
      - name: Set version
        run: npm version --no-git-tag-version --allow-same-version ${{ needs.prepare.outputs.version }}
      - name: Build signed package
        if: needs.prepare.outputs.is_release == 'true'
        run: npm run package:mac:x64
      - name: Build unsigned dev package
        if: needs.prepare.outputs.is_release != 'true'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run package:dev:mac:x64
      - uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          path: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml
            dist-dev/*.dmg
            dist-dev/*.zip
            dist-dev/latest-mac.yml
          if-no-files-found: warn
          retention-days: 7

  build-windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 180
    needs: [quality, prepare]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Set version
        run: npm version --no-git-tag-version --allow-same-version ${{ needs.prepare.outputs.version }}
      - name: Build release package (unsigned)
        if: needs.prepare.outputs.is_release == 'true'
        run: npm run package:win
      - name: Build dev package
        if: needs.prepare.outputs.is_release != 'true'
        run: npm run package:dev:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist/*.exe
            dist/latest.yml
            dist-dev/*.exe
            dist-dev/latest.yml
          if-no-files-found: warn
          retention-days: 7

  publish:
    name: Publish
    if: needs.prepare.outputs.is_release == 'true'
    needs: [prepare, build-macos-arm64, build-macos-x64, build-windows]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create GitHub Release
        run: |
          gh release create "${{ needs.prepare.outputs.tag }}" \
            release-assets/*/* \
            --verify-tag \
            --title "Mitsumeru Desktop ${{ needs.prepare.outputs.tag }}" \
            --generate-notes
