name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      prerelease_tag:
        description: 'Pre-release tag'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  quality:
    name: Typecheck & Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  prepare:
    name: Prepare version
    runs-on: ubuntu-latest
    needs: [quality]
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      is_release: ${{ steps.version.outputs.is_release }}
    steps:
      - id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
            IS_RELEASE=true
          elif [ -n "${{ inputs.prerelease_tag }}" ]; then
            TAG="${{ inputs.prerelease_tag }}"
            VERSION="$TAG"
            IS_RELEASE=false
          else
            TAG="dev-$(date -u +%Y%m%d-%H%M%S)"
            VERSION="0.0.0-dev"
            IS_RELEASE=false
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is_release=$IS_RELEASE" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish
    if: needs.prepare.outputs.is_release == 'true'
    needs: [prepare]
    runs-on: ubuntu-latest
    steps:
      - run: echo "publish ${{ needs.prepare.outputs.tag }}"
