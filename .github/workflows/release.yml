name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      prerelease_tag:
        description: Pre-release tag
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  NODE_VERSION: '22'
jobs:
  quality:
    name: Quality
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    needs: [quality]
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      is_release: ${{ steps.v.outputs.is_release }}
    steps:
      - id: v
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
            IS_RELEASE=true
          elif [ -n "${{ inputs.prerelease_tag }}" ]; then
            TAG="${{ inputs.prerelease_tag }}"
            VERSION="$TAG"
            IS_RELEASE=false
          else
            TAG="dev-$(date -u +%Y%m%d-%H%M%S)"
            VERSION="0.0.0-dev"
            IS_RELEASE=false
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is_release=$IS_RELEASE" >> "$GITHUB_OUTPUT"
  build-mac-arm64:
    name: macOS ARM64
    runs-on: macos-15
    timeout-minutes: 180
    needs: [quality, prepare]
    env:
      IS_RELEASE: ${{ needs.prepare.outputs.is_release }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run package:mac:arm64
  publish:
    name: Publish
    if: needs.prepare.outputs.is_release == 'true'
    needs: [prepare, build-mac-arm64]
    runs-on: ubuntu-latest
    steps:
      - run: echo "publish"
