name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      prerelease_tag:
        description: 'Pre-release tag (e.g. 0.1.3-rc.1)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  quality:
    name: Typecheck & Test
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  prepare:
    name: Prepare version
    runs-on: ubuntu-latest
    needs: [quality]
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      is_release: ${{ steps.version.outputs.is_release }}
    steps:
      - id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
            IS_RELEASE=true
          elif [ -n "${{ inputs.prerelease_tag }}" ]; then
            TAG="${{ inputs.prerelease_tag }}"
            VERSION="$TAG"
            IS_RELEASE=false
          else
            TAG="dev-$(date -u +%Y%m%d-%H%M%S)"
            VERSION="0.0.0-dev"
            IS_RELEASE=false
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is_release=$IS_RELEASE" >> "$GITHUB_OUTPUT"

  build-macos-arm64:
    name: macOS Apple Silicon
    runs-on: macos-15
    needs: [prepare]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Prepare signing credentials
        if: needs.prepare.outputs.is_release == 'true'
        env:
          CSC_P12_BASE64: ${{ secrets.DESKTOP_CSC_LINK }}
          CSC_PASSWORD: ${{ secrets.DESKTOP_CSC_KEY_PASSWORD }}
          API_KEY_CONTENT: ${{ secrets.DESKTOP_APPLE_API_KEY }}
          API_KEY_ID: ${{ secrets.DESKTOP_APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.DESKTOP_APPLE_API_ISSUER }}
        run: |
          node -e "const fs=require('fs');const b=process.env.CSC_P12_BASE64||'';fs.writeFileSync(process.env.RUNNER_TEMP+'/developer-id.p12',Buffer.from(b.replace(/^data:.*;base64,/,''),'base64'),{mode:0o600});"
          printf '%s' "$API_KEY_CONTENT" > "$RUNNER_TEMP/AuthKey_${API_KEY_ID}.p8"
          echo "CSC_LINK=$RUNNER_TEMP/developer-id.p12" >> "$GITHUB_ENV"
          echo "CSC_KEY_PASSWORD=$CSC_PASSWORD" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey_${API_KEY_ID}.p8" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_ID=$API_KEY_ID" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=$API_ISSUER" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Set version
        run: npm version --no-git-tag-version --allow-same-version "${{ needs.prepare.outputs.version }}"
      - name: Build signed package
        if: needs.prepare.outputs.is_release == 'true'
        run: npm run package:mac:arm64
      - name: Build unsigned dev package
        if: needs.prepare.outputs.is_release != 'true'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run package:dev:mac:arm64
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml
          if-no-files-found: warn
          retention-days: 7

  build-macos-x64:
    name: macOS Intel
    runs-on: macos-15-intel
    needs: [prepare]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Prepare signing credentials
        if: needs.prepare.outputs.is_release == 'true'
        env:
          CSC_P12_BASE64: ${{ secrets.DESKTOP_CSC_LINK }}
          CSC_PASSWORD: ${{ secrets.DESKTOP_CSC_KEY_PASSWORD }}
          API_KEY_CONTENT: ${{ secrets.DESKTOP_APPLE_API_KEY }}
          API_KEY_ID: ${{ secrets.DESKTOP_APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.DESKTOP_APPLE_API_ISSUER }}
        run: |
          node -e "const fs=require('fs');const b=process.env.CSC_P12_BASE64||'';fs.writeFileSync(process.env.RUNNER_TEMP+'/developer-id.p12',Buffer.from(b.replace(/^data:.*;base64,/,''),'base64'),{mode:0o600});"
          printf '%s' "$API_KEY_CONTENT" > "$RUNNER_TEMP/AuthKey_${API_KEY_ID}.p8"
          echo "CSC_LINK=$RUNNER_TEMP/developer-id.p12" >> "$GITHUB_ENV"
          echo "CSC_KEY_PASSWORD=$CSC_PASSWORD" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey_${API_KEY_ID}.p8" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_ID=$API_KEY_ID" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=$API_ISSUER" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Set version
        run: npm version --no-git-tag-version --allow-same-version "${{ needs.prepare.outputs.version }}"
      - name: Build signed package
        if: needs.prepare.outputs.is_release == 'true'
        run: npm run package:mac:x64
      - name: Build unsigned dev package
        if: needs.prepare.outputs.is_release != 'true'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run package:dev:mac:x64
      - uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          path: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml
          if-no-files-found: warn
          retention-days: 7

  build-windows:
    name: Windows x64
    runs-on: windows-latest
    needs: [prepare]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Set version
        run: npm version --no-git-tag-version --allow-same-version "${{ needs.prepare.outputs.version }}"
      - name: Build release package (unsigned)
        if: needs.prepare.outputs.is_release == 'true'
        run: npm run package:win
      - name: Build dev package
        if: needs.prepare.outputs.is_release != 'true'
        run: npm run package:dev:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist/*.exe
            dist/latest.yml
          if-no-files-found: warn
          retention-days: 7

  publish:
    name: Publish GitHub Release
    if: needs.prepare.outputs.is_release == 'true'
    needs: [prepare, build-macos-arm64, build-macos-x64, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create GitHub Release
        run: |
          gh release create "${{ needs.prepare.outputs.tag }}" \
            release-assets/*/* \
            --verify-tag \
            --title "Mitsumeru Desktop ${{ needs.prepare.outputs.tag }}" \
            --generate-notes
