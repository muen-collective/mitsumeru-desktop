name: Release test
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target:
        description: Platform
        required: false
        default: all
        type: choice
        options: [all, macos, windows]
      prerelease_tag:
        description: Pre-release tag
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  NODE_VERSION: '22'
jobs:
  quality:
    name: Quality
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      is_release: ${{ steps.v.outputs.is_release }}
    steps:
      - id: v
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.prerelease_tag }}" ]]; then
            echo "version=${{ inputs.prerelease_tag }}" >> "$GITHUB_OUTPUT"
            echo "tag=${{ inputs.prerelease_tag }}" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
            echo "tag=dev-$(date -u +%%Y%%m%%d-%%H%%M%%S)" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi
  build-mac-arm64:
    name: macOS ARM64
    runs-on: macos-15
    timeout-minutes: 180
    needs: [quality, prepare]
    env:
      IS_RELEASE: ${{ needs.prepare.outputs.is_release }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run package:mac:arm64
  publish:
    name: Publish
    if: needs.prepare.outputs.is_release == 'true'
    needs: [prepare, build-mac-arm64]
    runs-on: ubuntu-latest
    steps:
      - run: echo "publish"
